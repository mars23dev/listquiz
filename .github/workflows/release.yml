name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked

      - name: Package the portable release
        shell: pwsh
        run: ./scripts/package-release.ps1 -SkipBuild

      - name: Attach the portable archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/listquiz-windows-x64.zip
            release/listquiz-windows-x64.zip.sha256
